{% extends 'base.html' %}{% block title %}Create account — EVLoc AI{% endblock %}{% block content %}<section class="auth-wrap"><div class="auth-card"><div class="eyebrow">Start exploring</div><h1>Create your account</h1><p>Save your location analyses and compare opportunities later.</p><form method="post"><div class="field"><label>Full name</label><input name="name" placeholder="Your name" required></div><div class="field"><label>Email</label><input name="email" type="email" placeholder="you@example.com" required></div><div class="field"><label>Password</label><input name="password" type="password" minlength="6" placeholder="Minimum 6 characters" required></div><button class="btn btn-primary full" type="submit">Create account →</button></form><div class="auth-foot">Already have an account? <a href="{{ url_for('login') }}">Login</a></div></div></section>{% endblock %}
